global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: app-plug
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app-plug:8080

  - job_name: payment-history-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - payment-history-service:8080
